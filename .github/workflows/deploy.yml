name: Deploy to GitHub Pages

# Manual only — on purpose.
#
# indrakusuma.web.id currently serves the Hexo site built on `master`. Running
# this workflow replaces what the domain serves with the static export from this
# branch, so it never fires on push. Trigger it from the Actions tab when the
# site is ready to go live.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build and deploy'
        required: false
        default: 'develop'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys publish at once; queue instead of cancelling so a
# half-finished deploy is not left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
