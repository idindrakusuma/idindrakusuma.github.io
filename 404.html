<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to indrakusuma.dev</title>
    <!--
      GitHub Pages serves this repo at idindrakusuma.github.io. The real site lives
      at indrakusuma.dev (hosted on Netlify), so everything here bounces there.

      This repo is a user site, which GitHub does not allow to be deactivated, so a
      redirect is the way to stop the Pages URL serving stale content of its own.
    -->
    <link rel="canonical" href="https://indrakusuma.dev/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://indrakusuma.dev/" />
    <script>
      location.replace('https://indrakusuma.dev/');
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://indrakusuma.dev/">indrakusuma.dev</a>…</p>
  </body>
</html>
